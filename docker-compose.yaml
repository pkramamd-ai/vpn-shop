services:
  bot:
    # Pulls the fork's auto-built image (built by GitHub Actions in
    # pkramamd-ai/remnawave-telegram-shop on every push to main).
    # Switch back to upstream by replacing with:
    #   ghcr.io/jolymmiels/remnawave-telegram-shop-bot:latest
    image: ghcr.io/pkramamd-ai/remnawave-telegram-shop-bot:latest
    container_name: vpn-shop-bot
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./translations:/translations

  db:
    image: postgres:17
    container_name: vpn-shop-db
    hostname: vpn-shop-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - TZ=UTC
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - vpn-shop-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 3s
      timeout: 10s
      retries: 3

volumes:
  vpn-shop-db-data:
    driver: local
    name: vpn-shop-db-data
